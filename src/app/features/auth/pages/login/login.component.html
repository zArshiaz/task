<div class="w-full max-w-md">
  <div class="mb-10 md:hidden">
    <p class="text-sm font-medium text-cyan-700">پنل مدیریت فروشگاه</p>
    <h1 class="mt-2 text-2xl font-bold text-slate-900">فروشگاه من</h1>
  </div>

  <div class="mb-8">
    <h2 class="text-3xl font-bold text-slate-900">خوش آمدید</h2>
    <p class="mt-3 leading-7 text-slate-500">
      برای ورود به پنل مدیریت، اطلاعات حساب خود را وارد کنید.
    </p>
  </div>

  @if (errorMessage(); as message) {
    <app-alert class="mb-5 block" variant="error" [message]="message" />
  }

  <form [formGroup]="loginForm" (ngSubmit)="submit()" class="flex flex-col gap-2">
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>نام کاربری</mat-label>
      <input matInput formControlName="username" autocomplete="username" />
      <mat-error appFormControlError [control]="loginForm.controls.username" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>رمز عبور</mat-label>
      <input matInput type="password" formControlName="password" autocomplete="current-password" />
      <mat-error appFormControlError [control]="loginForm.controls.password" />
    </mat-form-field>

    <button
      mat-flat-button
      type="submit"
      class="!mt-4 !h-12 !rounded-xl"
      [appLoadingButton]="isSubmitting()"
    >
      ورود به پنل
    </button>
  </form>

  <p class="mt-8 text-center text-xs leading-6 text-slate-400">
    اطلاعات ورود شما به‌صورت امن پردازش می‌شود.
  </p>
</div>
