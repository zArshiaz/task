<main
  class="h-dvh overflow-hidden md:grid md:place-items-center md:p-8"
  dir="rtl"
>
  <section
    class="grid h-dvh w-full grid-rows-[minmax(0,1fr)_auto] overflow-hidden
         md:h-auto md:max-w-6xl md:grid-cols-2 md:grid-rows-1
         lg:aspect-video md:rounded-2xl md:bg-white/90
         md:shadow-2xl md:shadow-slate-950/30"
    aria-label="ورود به پنل مدیریت فروشگاه"
  >
    <div class="auth-visual relative isolate min-h-0 overflow-hidden">
      <span class="lamp-cord" aria-hidden="true"></span>

      <div class="relative z-20 hidden px-8 pt-20 md:pt-24 text-center text-white md:block">
        <h1 class="m-0 text-2xl font-extrabold lg:text-3xl">
          مدیریت هوشمند فروشگاه لباس
        </h1>
        <p class="mt-3 text-sm text-white/80 md:text-base lg:text-lg">
          سفارش‌ها، محصولات و موجودی را یکجا کنترل کنید
        </p>
      </div>

      <img
        class="auth-hero-image absolute bottom-0 left-1/2 z-10 h-auto w-full max-w-none -translate-x-1/2 object-contain"
        src="/images/auth/fashion-dashboard-hero.png"
        alt="تصویرسازی پنل مدیریت فروشگاه پوشاک"
        width="1536"
        height="1024"
      />
    </div>

    <div class="relative z-30 -mt-7 flex min-h-0 items-start justify-center overflow-y-auto rounded-t-3xl bg-slate-50 px-6 py-8 shadow-xl shadow-cyan-900/10 md:m-0 md:items-center md:rounded-none md:bg-white/90 md:px-12 md:py-10 md:shadow-none">
      <router-outlet />
    </div>
  </section>
</main>
