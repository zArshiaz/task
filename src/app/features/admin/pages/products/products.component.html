<section aria-labelledby="products-title">
  <app-page-header
    title="محصولات"
    description="محصولات فروشگاه را مشاهده، ویرایش یا حذف کنید."
    titleId="products-title"
  >
    <button page-header-actions mat-flat-button type="button" (click)="openCreateForm()">
      افزودن محصول
    </button>
  </app-page-header>

  @if (errorMessage(); as message) {
    <div class="mt-5 flex flex-wrap items-center gap-3">
      <app-alert class="min-w-64 flex-1" variant="error" [message]="message" />
      <button mat-stroked-button type="button" (click)="loadProducts()">تلاش دوباره</button>
    </div>
  }

  @if (isLoading()) {
    <div
      class="mt-5 grid min-h-80 place-items-center"
      role="status"
      aria-label="در حال دریافت محصولات"
    >
      <mat-spinner diameter="40" />
    </div>
  } @else if (!errorMessage() && products().length === 0) {
    <app-alert class="mt-5 block" variant="info" message="محصولی برای نمایش وجود ندارد." />
  } @else if (!errorMessage()) {
    <div class="mt-5">
      <app-products-table
        [products]="products()"
        [deletingProductId]="deletingProductId()"
        (editRequested)="openEditForm($event)"
        (deleteRequested)="confirmDelete($event)"
      />
    </div>
  }
</section>
