<article
  class="flex h-full flex-col overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm transition duration-200 hover:-translate-y-0.5 hover:shadow-md"
>
  <div class="flex items-start gap-3 p-4 sm:block sm:p-5">
    <div
      class="group/image relative size-28 shrink-0 cursor-zoom-in overflow-hidden rounded-xl bg-slate-50 sm:aspect-[4/3] sm:h-auto sm:w-full"
    >
      <img
        [src]="product().image"
        [alt]="product().title"
        class="absolute inset-0 size-full object-contain p-2 transition-transform duration-300 ease-out group-hover/image:scale-110"
      />
    </div>

    <div class="min-w-0 flex-1 sm:mt-4">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <span class="rounded-full bg-sky-50 px-2.5 py-1 text-xs font-medium text-sky-800">
          {{ product().category }}
        </span>
        <span class="text-sm font-bold text-slate-900">
          {{ product().price.toLocaleString('en-US') }} دلار
        </span>
      </div>

      <h3 class="mt-2 line-clamp-2 font-medium leading-6 text-slate-900">
        {{ product().title }}
      </h3>
      <p class="mt-2 hidden text-sm leading-6 text-slate-500 sm:line-clamp-2">
        {{ product().description }}
      </p>
    </div>
  </div>

  <div
    class="mt-auto flex items-center justify-between border-t border-slate-100 bg-slate-50/50 px-4 py-2 sm:px-5"
  >
    <span class="text-xs text-slate-500">شناسه: {{ product().id }}</span>
    <div class="flex items-center gap-1">
      <button
        mat-icon-button
        type="button"
        class="!text-slate-600"
        aria-label="نمایش جزئیات محصول"
        (click)="detailsRequested.emit(product())"
      >
        <mat-icon aria-hidden="true">more_horiz</mat-icon>
      </button>
      <button
        mat-icon-button
        type="button"
        class="!text-cyan-700"
        aria-label="ویرایش محصول"
        (click)="editRequested.emit(product())"
      >
        <mat-icon aria-hidden="true">edit</mat-icon>
      </button>
      <button
        mat-icon-button
        type="button"
        class="!text-rose-600"
        aria-label="حذف محصول"
        [appLoadingButton]="deleting()"
        [appLoadingButtonShowContent]="false"
        (click)="deleteRequested.emit(product())"
      >
        <mat-icon aria-hidden="true">delete_outline</mat-icon>
      </button>
    </div>
  </div>
</article>
