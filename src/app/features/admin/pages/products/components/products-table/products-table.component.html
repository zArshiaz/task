<section class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm" aria-label="فهرست محصولات">
  @if (loading()) {
    <div class="grid min-h-80 place-items-center" role="status" aria-label="در حال دریافت محصولات">
      <mat-spinner diameter="40" />
    </div>
  } @else {
    <div class="overflow-x-auto">
      <table mat-table [dataSource]="dataSource" matSort class="w-full min-w-3xl text-right text-sm">
        <ng-container matColumnDef="image">
          <th mat-header-cell *matHeaderCellDef class="px-5 py-3 text-right text-xs font-medium text-slate-500">
            تصویر
          </th>
          <td mat-cell *matCellDef="let product" class="px-5 py-3">
            <img
              [src]="product.image"
              [alt]="product.title"
              class="size-12 rounded-lg border border-slate-100 object-contain p-1"
            />
          </td>
        </ng-container>

        <ng-container matColumnDef="title">
          <th mat-header-cell mat-sort-header *matHeaderCellDef class="px-5 py-3 text-right text-xs font-medium text-slate-500">
            محصول
          </th>
          <td mat-cell *matCellDef="let product" class="max-w-64 px-5 py-3 font-medium text-slate-900">
            <span class="line-clamp-2">{{ product.title }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="category">
          <th mat-header-cell mat-sort-header *matHeaderCellDef class="px-5 py-3 text-right text-xs font-medium text-slate-500">
            دسته‌بندی
          </th>
          <td mat-cell *matCellDef="let product" class="whitespace-nowrap px-5 py-3 text-slate-600">
            {{ product.category }}
          </td>
        </ng-container>

        <ng-container matColumnDef="price">
          <th mat-header-cell mat-sort-header *matHeaderCellDef class="px-5 py-3 text-right text-xs font-medium text-slate-500">
            قیمت
          </th>
          <td mat-cell *matCellDef="let product" class="whitespace-nowrap px-5 py-3 font-medium text-slate-800">
            {{ product.price.toLocaleString('fa-IR') }} دلار
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="px-5 py-3 text-left text-xs font-medium text-slate-500">
            عملیات
          </th>
          <td mat-cell *matCellDef="let product" class="whitespace-nowrap px-5 py-3 text-left">
            <button
              mat-icon-button
              type="button"
              class="!text-cyan-700"
              aria-label="ویرایش محصول"
              (click)="editRequested.emit(product)"
            >
              <mat-icon aria-hidden="true">edit</mat-icon>
            </button>
            <button
              mat-icon-button
              type="button"
              class="!text-rose-600"
              aria-label="حذف محصول"
              [disabled]="deletingProductId() === product.id"
              (click)="deleteRequested.emit(product)"
            >
              @if (deletingProductId() === product.id) {
                <mat-spinner diameter="18" />
              } @else {
                <mat-icon aria-hidden="true">delete_outline</mat-icon>
              }
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns" class="bg-slate-50"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns" class="hover:bg-slate-50"></tr>
        <tr *matNoDataRow>
          <td [attr.colspan]="displayedColumns.length" class="px-5 py-12 text-center text-sm text-slate-500">
            محصولی برای نمایش وجود ندارد.
          </td>
        </tr>
      </table>
    </div>

    <mat-paginator [pageSizeOptions]="[5, 10, 20]" [pageSize]="10" showFirstLastButtons />
  }
</section>
