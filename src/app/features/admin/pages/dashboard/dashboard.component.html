<section aria-labelledby="dashboard-title">
  <app-page-header
    title="سلام، روز خوبی داشته باشید!"
    description="آخرین وضعیت فروشگاه و سفارش‌ها را در یک نگاه ببینید."
    titleId="dashboard-title"
    [showDate]="true"
  />

  <div class="mt-7 grid gap-4 sm:grid-cols-2 xl:grid-cols-4">
    @for (stat of stats; track stat.label) {
      <app-dashboard-stat-card [stat]="stat" />
    }
  </div>

  <div class="mt-6 grid gap-6 xl:grid-cols-[minmax(0,1.6fr)_minmax(17rem,0.7fr)]">
    <app-dashboard-recent-orders [orders]="recentOrders" />
    <app-dashboard-monthly-performance />
  </div>
</section>
