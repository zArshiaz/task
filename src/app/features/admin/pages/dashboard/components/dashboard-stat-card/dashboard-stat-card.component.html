<article class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
  <div class="flex items-start justify-between gap-3">
    <div>
      <p class="text-sm text-slate-500">{{ stat().label }}</p>
      <p class="mt-3 text-xl font-bold text-slate-900">{{ stat().value }}</p>
    </div>
    <span
      class="grid size-11 shrink-0 place-items-center rounded-xl"
      [class]="stat().iconClasses"
    >
      <mat-icon aria-hidden="true">{{ stat().icon }}</mat-icon>
    </span>
  </div>
  <p class="mt-4 text-xs text-slate-500">{{ stat().change }}</p>
</article>
