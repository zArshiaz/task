<aside class="rounded-2xl bg-slate-900 p-6 text-white shadow-sm" aria-labelledby="store-status-title">
  <span class="grid size-11 place-items-center rounded-xl bg-brand-primary text-brand-on-primary">
    <mat-icon aria-hidden="true">insights</mat-icon>
  </span>
  <h2 id="store-status-title" class="mt-5 text-lg font-bold">عملکرد این ماه</h2>
  <p class="mt-2 text-sm leading-7 text-slate-300">
    فروش شما نسبت به ماه گذشته ۱۸ درصد رشد داشته است.
  </p>
  <div class="mt-6">
    <div class="flex items-center justify-between text-xs">
      <span class="text-slate-300">هدف فروش ماهانه</span>
      <span class="font-bold text-cyan-300">{{ monthlyGoalProgress }}٪</span>
    </div>
    <div
      class="mt-3 h-2 overflow-hidden rounded-full bg-slate-700"
      role="progressbar"
      aria-label="پیشرفت هدف فروش ماهانه"
      [attr.aria-valuenow]="monthlyGoalProgress"
      aria-valuemin="0"
      aria-valuemax="100"
    >
      <div class="h-full rounded-full bg-brand-primary" [style.width.%]="monthlyGoalProgress"></div>
    </div>
  </div>
</aside>
