<section
  class="grid min-h-[calc(100dvh-8rem)] place-items-center"
  [attr.aria-labelledby]="icon + '-title'"
>
  <div
    class="w-full max-w-xl rounded-3xl border border-slate-200 bg-white p-8 text-center shadow-sm sm:p-12"
  >
    <span class="mx-auto grid size-16 place-items-center rounded-2xl bg-cyan-100 text-cyan-800">
      <mat-icon aria-hidden="true">{{ icon }}</mat-icon>
    </span>
    <h1 [id]="icon + '-title'" class="mt-6 text-2xl font-bold text-slate-900">{{ title }}</h1>
    <p class="mx-auto mt-3 max-w-md leading-7 text-slate-500">{{ description }}</p>
    <span
      class="mt-6 inline-flex rounded-full bg-slate-100 px-4 py-2 text-xs font-medium text-slate-600"
      >به‌زودی تکمیل می‌شود</span
    >
  </div>
</section>
