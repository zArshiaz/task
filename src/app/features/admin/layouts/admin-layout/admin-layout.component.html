<mat-sidenav-container class="admin-shell" dir="rtl">
  <mat-sidenav
    #mobileSidebar
    class="mobile-sidebar"
    mode="over"
    position="start"
    aria-label="منوی اصلی پنل مدیریت"
  >
    <app-admin-sidebar
      class="block h-full"
      [navigationItems]="navigationItems"
      [mobile]="true"
      (closeRequested)="mobileSidebar.close()"
      (logoutRequested)="logout()"
    />
  </mat-sidenav>

  <mat-sidenav-content class="admin-content">
    <div class="flex h-full min-h-0 overflow-hidden bg-slate-100">
      <app-admin-sidebar
        class="hidden h-full min-h-0 shrink-0 lg:block"
        [navigationItems]="navigationItems"
        (logoutRequested)="logout()"
      />

      <div class="flex h-full min-h-0 min-w-0 flex-1 flex-col">
        <app-admin-header
          [mobileMenuExpanded]="mobileSidebar.opened"
          [username]="authStore.username()"
          (mobileMenuRequested)="mobileSidebar.open()"
        />

        <main class="min-h-0 flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 lg:pt-5">
          <router-outlet />
        </main>
      </div>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
