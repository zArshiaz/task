<header
  class="sticky top-0 z-20 flex min-h-16 shrink-0 items-center gap-3 border-b border-slate-200 bg-white/95 px-4 sm:px-6 backdrop-blur"
>
  <span class="lg:hidden">
    <button
      mat-icon-button
      type="button"
      aria-label="باز کردن منوی اصلی"
      [attr.aria-expanded]="mobileMenuExpanded()"
      (click)="mobileMenuRequested.emit()"
    >
      <mat-icon>menu</mat-icon>
    </button>
  </span>


  <div class="min-w-0 flex-1">
    <p class="truncate font-bold text-slate-900">پنل مدیریت فروشگاه</p>
    <p class="mt-0.5 hidden text-xs text-slate-500 sm:block">مدیریت سریع و یکپارچه کسب‌وکار</p>
  </div>

  <div class="flex items-center gap-2 ">
    <div>
      <p>نام کاربری</p>
      <p class="text-xs leading-1.5 mb-1.5">{{username()}}</p>
    </div>
    <span
      class="flex items-center justify-center size-9 rounded-full bg-slate-900 text-sm font-bold text-cyan-300"
      [attr.aria-label]="username() ? 'کاربر ' + username() : 'کاربر پنل مدیریت'"
    >
    {{ usernameInitial() }}
  </span>
  </div>
</header>
